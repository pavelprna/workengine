[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/application",
  "crates/adapters-store",
  "crates/adapters-worker",
  "crates/adapters-workspace",
  "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.98.1"

[workspace.dependencies]
workengine-domain = { path = "crates/domain" }
workengine-application = { path = "crates/application" }
workengine-adapters-store = { path = "crates/adapters-store" }
workengine-adapters-worker = { path = "crates/adapters-worker" }
workengine-adapters-workspace = { path = "crates/adapters-workspace" }
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
uuid = { version = "1.26.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.37.0", features = ["bundled"] }
nix = { version = "0.30.1", default-features = false, features = ["process", "signal", "fs", "user"] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
